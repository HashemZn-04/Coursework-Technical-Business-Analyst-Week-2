{% extends "base.html" %}
{% block title %}Promise to Pay - Smart-Recovery Portal{% endblock %}
{% block content %}
<h1>Promise to Pay</h1>
<p class="subtitle">Commit to a future payment date and amount for {{ user.account_ref }}.</p>

<div class="card">
  <form method="post">
    <label for="promise_date">Promised payment date</label>
    <input type="date" id="promise_date" name="promise_date" required>

    <label for="amount">Promised amount ($)</label>
    <input type="number" id="amount" name="amount" min="1" step="0.01"
           value="{{ user.overdue_amount }}" required>

    <div class="action-buttons">
      <button type="submit" class="btn-primary">Confirm Promise</button>
      <a class="btn-secondary" href="{{ url_for('account_summary') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
